# raffle-ticket-web — serves the built SPA and reverse-proxies the API.
#
# Same-origin design: the frontend client uses relative URLs for the REST API
# (VITE_API_URL empty) and connects its WebSocket to window.location.host, so
# everything below routes through this single entry point.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded ticket background designs — shared named volume with the API
    # container (read-only here).  With DEBUG=0 Django no longer serves
    # these, so the proxy must.
    location /media/ {
        alias /media/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django static assets (admin site) — read-only shared volume filled by
    # `collectstatic` on API startup.
    location /static/ {
        alias /staticfiles/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # REST API → daphne.
    location /api/ {
        proxy_pass http://raffle-ticket-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ticket background uploads are limited to 10 MB by the API; allow
        # headroom for the multipart envelope.
        client_max_body_size 25m;
        proxy_read_timeout 60s;
    }

    # Django admin (its /static/ assets are served from the shared volume).
    # DJANGO_CSRF_TRUSTED_ORIGINS must include the public origin for logins.
    location /admin/ {
        proxy_pass http://raffle-ticket-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # WebSocket endpoint (/ws/reservations/) → daphne, with HTTP/1.1 upgrade.
    location /ws/ {
        proxy_pass http://raffle-ticket-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Vite emits hashed assets under /assets/ — cache them forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}