<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/raffle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts (ticket designer font families).
         Loaded here — NOT via @import in index.css — because Tailwind v4
         inlines its own CSS where `@import "tailwindcss"` stands, which would
         push a later @import url(...) after other rules where browsers must
         ignore it.  A <link> in the HTML head always loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Caveat:wght@400;500;600;700&family=Cookie&family=Dancing+Script:wght@400;500;600;700&family=Great+Vibes&family=Kalam:wght@300;400;700&family=Lobster&family=Pacifico&family=Sacramento&family=Satisfy&display=swap"
    />
    <title>Raffle Ticket Reservation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
